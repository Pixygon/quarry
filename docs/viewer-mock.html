function render(){const list=MODELS.filter(m=>(sup==='all'||m.supplier===sup)&&(!q||(m.title+' '+m.kind+' '+m.tags.join(' ')).toLowerCase().includes(q)));

function show(){const m=MODELS.find(x=>x.design===cur);$('#t-title').textContent=m.title;$('#t-kind').textContent=m.kind+(m.style?' · '+m.style:'')+' · '+m.supplier;

 const f=m.facts,s=f.size;$('#facts').innerHTML=`<dt>Size</dt><dd>${s.map(v=>v.toFixed(2)).join(' × ')} m</dd><dt>Origin</dt><dd>${f.origin}</dd><dt>Front</dt><dd>${f.front}</dd><dt>Collider</dt><dd>${f.collider}</dd><dt>Parts</dt><dd>${f.parts} · ${f.materials.join(', ')}</dd><dt>Triangles</dt><dd>${fmt(m.artifact.tris)}</dd><dt>LODs</dt><dd>${lods.length?lods.length+' coarser':'none'}</dd><dt>Bytes</dt><dd>${fmt(m.artifact.bytes)}</dd>`;
 const r=m.recipe;$('#recipe').innerHTML=r.package==='grove'?`<dt>Package</dt><dd>grove</dd><dt>Grown from</dt><dd>${Object.keys(r.recipe||{}).length} rules · seed ${(r.recipe||{}).seed??'default'}</dd>`:`<dt>Package</dt><dd>${r.package}</dd><dt>Export</dt><dd>${r.export}(${(r.args||[]).join(', ')})</dd><dt>Material</dt><dd>${r.material||'its own'}</dd>`;

 $('#foot').innerHTML=`<span>design <b>${m.design}</b></span><span>artifact <b>${m.artifact.url}</b></span><span>${lods.map((u,i)=>'lod'+(i+1)+' <b>'+u.split('/').pop()+'</b>').join(' · ')||'no coarser lods'}</span>`;
 const v=ls('verdict:'+m.design);for(const b of document.querySelectorAll('#verdict button'))b.setAttribute('aria-pressed',String(b.dataset.v===v));$('#note').value=ls('note:'+m.design)||'';
 const jp=$('#judge').getAttribute('aria-pressed')==='true';const c=CONCEPTS[m.design];$('#cpane').hidden=!jp;$('#stage').classList.toggle('split',jp);

for(const b of document.querySelectorAll('#sup .chip:not([disabled])'))b.onclick=()=>{sup=b.dataset.sup;for(const x of document.querySelectorAll('#sup .chip'))x.setAttribute('aria-pressed',String(x===b));render()};
